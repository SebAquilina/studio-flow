<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#eef0e9"/>
  <!-- thin horizon line at golden ratio -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#1f2624" stroke-width="1" opacity="0.5"/>
  <!-- one figure silhouette: simplified pose -->
  <g transform="translate(540,310)" stroke="#1f2624" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- head -->
    <circle cx="60" cy="0" r="24" fill="#1f2624" opacity="0.9"/>
    <!-- spine: long curved line -->
    <path d="M 60 24 C 60 100, 50 140, 60 190"/>
    <!-- arm raised -->
    <path d="M 60 80 C 30 60, 0 30, -10 -10"/>
    <!-- other arm to floor -->
    <path d="M 60 90 C 90 130, 110 170, 110 200"/>
    <!-- folded leg -->
    <path d="M 60 190 C 100 200, 130 215, 140 220"/>
    <!-- extended leg -->
    <path d="M 60 190 C 30 195, 0 198, -20 200"/>
  </g>
  <!-- breath-rhythm rings around figure -->
  <g fill="none" stroke="#7e8c63" stroke-width="0.8" opacity="0.4">
    <circle cx="600" cy="450" r="180"/>
    <circle cx="600" cy="450" r="240"/>
    <circle cx="600" cy="450" r="300"/>
  </g>
  <!-- chalk-style numerals: 6.6.6 breath -->
  <text x="100" y="120" font-family="Georgia, serif" font-size="56" fill="#1f2624" opacity="0.8">six</text>
  <text x="100" y="180" font-family="Inter, sans-serif" font-size="13" fill="#1f2624" opacity="0.6" letter-spacing="3">SECONDS IN</text>
  <text x="980" y="640" font-family="Georgia, serif" font-size="56" fill="#1f2624" opacity="0.8" text-anchor="end">six</text>
  <text x="1100" y="700" font-family="Inter, sans-serif" font-size="13" fill="#1f2624" opacity="0.6" letter-spacing="3" text-anchor="end">SECONDS OUT</text>
  <!-- accent dot -->
  <circle cx="600" cy="450" r="4" fill="#7e8c63"/>
</svg>