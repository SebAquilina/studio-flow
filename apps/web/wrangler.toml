pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_SITE_URL = "https://studio-flow-web.pages.dev"
ADMIN_OWNER_EMAILS = "seb.aquilina@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "studio-flow-db"
database_id = "1e5d3e58-6c73-4350-a255-06551e21e703"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "DEAD_LETTER"
id = "8811c444a65243bc8bf3b46ffa59c61f"

