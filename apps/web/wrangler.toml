name = "studio-flow-web"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_SITE_URL = "https://studio-flow-web.pages.dev"
ADMIN_OWNER_EMAILS = "seb.aquilina@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "studio-flow-db"
database_id = "PLACEHOLDER"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "DEAD_LETTER"
id = "PLACEHOLDER"

[env.preview]
name = "studio-flow-web-preview"
[env.preview.vars]
NEXT_PUBLIC_SITE_URL = "https://preview.studio-flow-web.pages.dev"
ADMIN_OWNER_EMAILS = "seb.aquilina@gmail.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "studio-flow-preview"
database_id = "PLACEHOLDER"
migrations_dir = "drizzle/migrations"

[[env.preview.kv_namespaces]]
binding = "DEAD_LETTER"
id = "1bd6acbf0d6e4f11b164cf9c1aeea787"
